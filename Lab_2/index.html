<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голяк О. Ю. | гр. ІП-45 | ЛР №2 | Варіант 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Лабораторна робота №2</h1>

    <!-- Завдання 1: Таблиця за макетом 4 варіанта -->
    <section>
        <h2>Завдання 1. HTML-таблиця за макетом (Варіант 4)</h2>
        <table class="custom-table">
            <tr class="row-1">
                <td>Голяк</td>
                <td>Олександр</td>
                <td rowspan="2">Юрійович</td>
                <td>ІП-45</td>
                <td rowspan="2">ЛР-2</td>
            </tr>
            <tr class="row-2">
                <td colspan="2">Варіант 4</td>
                <td>ФІОТ</td>
            </tr>
            <tr class="row-3">
                <td colspan="2">КПІ ім. Сікорського</td>
                <td colspan="3">2026</td>
            </tr>
        </table>
    </section>

    <!-- Завдання 2: Приціл/мішень -->
    <section>
        <h2>Завдання 2. Створення зображення засобами CSS (Варіант 4 — Приціл)</h2>

        <h3>1. Спосіб із використанням position:</h3>
        <div class="target-container">
            <div class="cross-v-pos"></div>
            <div class="cross-h-pos"></div>
            <div class="target-outer-pos"></div>
            <div class="target-center-pos"></div>
        </div>

        <h3>2. Спосіб із використанням transform:</h3>
        <div class="target-container">
            <div class="cross-v-tr"></div>
            <div class="cross-h-tr"></div>
            <div class="target-outer-tr"></div>
            <div class="target-center-tr"></div>
        </div>
    </section>

</body>
</html>
